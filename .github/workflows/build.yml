name: build

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分 (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Cloudflare Pages にも公開する (会社のネットワークから github.io が開けないため)
      # リポジトリの Secrets に両方設定されていなければスキップする
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDEFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          # 前回公開分とマージして、フィードから消えた記事も7日間は残す
          PREV_URL: ${{ steps.pages.outputs.base_url }}/items.json
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx --yes wrangler@4 pages project create terrazine --production-branch main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy site --project-name terrazine --branch main --commit-dirty=true
