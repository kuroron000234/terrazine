name: build

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分 (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write   # keepalive 用
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          # 前回公開分とマージして、フィードから消えた記事も7日間は残す
          PREV_URL: ${{ steps.pages.outputs.base_url }}/items.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # 公開リポジトリの定期実行は、60日間リポジトリに動きがないと GitHub に自動停止される。
      # ワークフローを「有効化」し直すと期限がリセットされるので、毎回それを行う
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/build.yml/enable
