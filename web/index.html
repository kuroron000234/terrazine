<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Radar</title>
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e4e4e0;
  --accent: #2b59c3; --chip: #ececea; --chip-on: #1d1d1f; --chip-on-text: #fff;
  --en: #2b59c3; --zh: #c8372d; --new: #e8890c; --visited: #8a8a8f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --panel: #1c1c1f; --text: #ececf0; --muted: #9a9aa2; --line: #2c2c31;
    --accent: #7aa2ff; --chip: #2a2a2f; --chip-on: #ececf0; --chip-on-text: #141416;
    --en: #7aa2ff; --zh: #ff7a6e; --new: #ffb347; --visited: #75757c;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --panel: #1c1c1f; --text: #ececf0; --muted: #9a9aa2; --line: #2c2c31;
  --accent: #7aa2ff; --chip: #2a2a2f; --chip-on: #ececf0; --chip-on-text: #141416;
  --en: #7aa2ff; --zh: #ff7a6e; --new: #ffb347; --visited: #75757c;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px 64px; }
header .wrap { padding-bottom: 0; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: baseline; gap: 12px; padding: 14px 0 8px; }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
.updated { color: var(--muted); font-size: 12px; margin-left: auto; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; align-items: center; }
.group { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  border: 0; background: var(--chip); color: var(--text); border-radius: 999px;
  padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
input[type=search], select {
  font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
}
input[type=search] { flex: 1; min-width: 140px; }
select { max-width: 160px; }
h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 24px 0 4px; }
ol { list-style: none; margin: 0; padding: 0; }
li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.title { color: var(--text); text-decoration: none; font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
.title:visited { color: var(--visited); }
.title:hover { color: var(--accent); }
.ja { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.summary { color: var(--muted); font-size: 13px; margin: 2px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
.meta a { color: var(--muted); }
.meta a:hover { color: var(--accent); }
.src { font-weight: 600; }
.src.en { color: var(--en); }
.src.zh { color: var(--zh); }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
.new { color: var(--new); font-weight: 700; font-size: 11px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.more { display: block; margin: 20px auto 0; }
@media (max-width: 560px) {
  .sep { display: none; }
  select { max-width: none; flex: 1; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Tech Radar</h1>
      <span class="updated" id="updated"></span>
    </div>
    <div class="controls">
      <div class="group" id="regions"></div>
      <span class="sep"></span>
      <div class="group" id="tags"></div>
      <select id="source" aria-label="ソース"></select>
      <input type="search" id="q" placeholder="検索 (例: DeepSeek, 芯片)">
    </div>
  </div>
</header>
<main class="wrap" id="list"></main>

<script>
const DATA = /*__DATA__*/null;

const REGIONS = [["all", "すべて"], ["en", "英語圏"], ["zh", "中華圏"]];
const TAGS = [["all", "全ジャンル"], ["ai", "AI"], ["dev", "開発"], ["hw", "ハード"]];
const TAG_LABEL = { ai: "AI", dev: "開発", hw: "ハード" };
const PAGE = 150;

const store = {
  get(k, d) { try { const v = localStorage.getItem("tr:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tr:" + k, JSON.stringify(v)); } catch {} },
};

const state = { region: store.get("region", "all"), tag: store.get("tag", "all"), source: "", q: "", shown: PAGE };
// 前回訪問より後に初めて取得された記事に「NEW」を付ける
const lastVisit = store.get("lastVisit", null);
store.set("lastVisit", new Date().toISOString());

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function chips(el, options, key) {
  el.innerHTML = options.map(([v, label]) => `<button class="chip" data-v="${v}" aria-pressed="${state[key] === v}">${label}</button>`).join("");
  el.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state[key] = b.dataset.v; store.set(key, state[key]); state.shown = PAGE;
    el.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    render();
  };
}

function rel(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "たった今";
  if (m < 60) return `${m}分前`;
  if (m < 60 * 24) return `${Math.floor(m / 60)}時間前`;
  return `${Math.floor(m / 1440)}日前`;
}

function dayLabel(iso) {
  const d = new Date(iso), today = new Date();
  const key = (x) => x.toDateString();
  const y = new Date(today); y.setDate(today.getDate() - 1);
  if (key(d) === key(today)) return "今日";
  if (key(d) === key(y)) return "昨日";
  return d.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" });
}

const translateUrl = (u) => `https://translate.google.com/translate?sl=auto&tl=ja&hl=ja&u=${encodeURIComponent(u)}`;

function filtered() {
  const q = state.q.trim().toLowerCase();
  return DATA.items.filter((it) =>
    (state.region === "all" || it.region === state.region) &&
    (state.tag === "all" || it.tags.includes(state.tag)) &&
    (!state.source || it.source === state.source) &&
    (!q || (it.title + " " + (it.title_ja || "") + " " + it.summary + " " + it.source).toLowerCase().includes(q))
  );
}

function itemHtml(it) {
  const isNew = lastVisit && it.first_seen > lastVisit;
  return `<li>
    <a class="title" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}${it.title_ja ? `<span class="ja">${esc(it.title_ja)}</span>` : ""}</a>
    ${it.summary ? `<p class="summary">${esc(it.summary_ja || it.summary)}</p>` : ""}
    <div class="meta">
      ${isNew ? '<span class="new">NEW</span>' : ""}
      <span class="src ${it.region}">${esc(it.source)}</span>
      <span title="${esc(new Date(it.published).toLocaleString("ja-JP"))}">${rel(it.published)}</span>
      ${it.tags.map((t) => `<span class="tag">${TAG_LABEL[t] || t}</span>`).join("")}
      <a href="${translateUrl(it.link)}" target="_blank" rel="noopener">日本語で読む</a>
      ${it.comments ? `<a href="${esc(it.comments)}" target="_blank" rel="noopener">コメント</a>` : ""}
    </div>
  </li>`;
}

function render() {
  const items = filtered();
  const list = $("list");
  if (!items.length) { list.innerHTML = '<p class="empty">該当する記事はありません</p>'; return; }
  let out = "", cur = null;
  for (const it of items.slice(0, state.shown)) {
    const label = dayLabel(it.published);
    if (label !== cur) { if (cur) out += "</ol>"; out += `<h2>${label}</h2><ol>`; cur = label; }
    out += itemHtml(it);
  }
  out += "</ol>";
  if (items.length > state.shown) out += `<button class="chip more" id="more">さらに表示（残り${items.length - state.shown}件）</button>`;
  list.innerHTML = out;
  const more = $("more");
  if (more) more.onclick = () => { state.shown += PAGE; render(); };
}

function init() {
  if (!DATA) { $("list").innerHTML = '<p class="empty">データがありません。build.py を実行してください。</p>'; return; }
  $("updated").textContent = `更新: ${rel(DATA.generated)}（${DATA.items.length}件）`;
  chips($("regions"), REGIONS, "region");
  chips($("tags"), TAGS, "tag");
  const counts = {};
  DATA.items.forEach((it) => { counts[it.source] = (counts[it.source] || 0) + 1; });
  $("source").innerHTML = '<option value="">すべてのソース</option>' +
    DATA.sources.map((s) => `<option value="${esc(s.name)}">${s.region === "zh" ? "🇨🇳" : "🌐"} ${esc(s.name)} (${counts[s.name] || 0})</option>`).join("");
  $("source").onchange = (e) => { state.source = e.target.value; state.shown = PAGE; render(); };
  let t;
  $("q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; render(); }, 150); };
  render();
}
init();
</script>
</body>
</html>
