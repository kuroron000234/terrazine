<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TERRAZINE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2307090a'/><text x='16' y='23' font-family='monospace' font-size='20' font-weight='700' text-anchor='middle' fill='%2339ff8f'>T</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090a;
  --surface: #0d1210;
  --surface-2: #121a16;
  --line: #1c2721;
  --text: #e8f0ea;
  --title: #f5faf6;
  --muted: #84968b;
  --dim: #56665c;
  --green: #39ff8f;
  --green-dim: #1f8f52;
  --ja: #ffb547;
  --en: #4fd6ff;
  --zh: #ff5f6d;
  --visited: #8fa297;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Noto Sans JP", "Hiragino Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.7 var(--sans);
  background-image: radial-gradient(rgba(57, 255, 143, .035) 1px, transparent 1px);
  background-size: 22px 22px;
}
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

/* ---------- マストヘッド ---------- */
.masthead { border-bottom: 1px solid var(--line); }
.masthead .wrap { display: flex; align-items: flex-end; gap: 16px; padding-top: 22px; padding-bottom: 14px; }
.logo {
  font: 800 40px/1 var(--mono); letter-spacing: .04em; color: var(--green); margin: 0;
  text-shadow: 0 0 18px rgba(57, 255, 143, .35);
}
.logo .cur { display: inline-block; width: .55em; height: .12em; background: var(--green); margin-left: .08em; vertical-align: baseline; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.tagline { font: 12px/1.5 var(--mono); color: var(--muted); padding-bottom: 3px; }
.tagline b { color: var(--green); font-weight: 400; }
.status { margin-left: auto; text-align: right; font: 12px/1.6 var(--mono); color: var(--muted); white-space: nowrap; padding-bottom: 2px; }
.status .ok { color: var(--green); }

/* ---------- ナビ ---------- */
nav.bar { position: sticky; top: 0; z-index: 10; background: rgba(7, 9, 10, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.regions { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
.regions::-webkit-scrollbar { display: none; }
.regions button {
  background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
  font: 700 14px/1 var(--sans); padding: 14px 18px 12px; cursor: pointer; white-space: nowrap;
}
.regions button:hover { color: var(--text); }
.regions button[aria-pressed="true"] { color: var(--title); border-bottom-color: var(--c, var(--green)); }
.regions .count { font: 400 11px var(--mono); color: var(--dim); margin-left: 6px; }
.filters { display: flex; gap: 8px; align-items: center; padding: 8px 0 10px; flex-wrap: wrap; }
.tags { display: flex; gap: 6px; }
.tags button {
  font: 700 12px/1 var(--mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line);
  border-radius: 4px; padding: 7px 10px; cursor: pointer;
}
.tags button:hover { color: var(--text); border-color: var(--green-dim); }
.tags button[aria-pressed="true"] { color: var(--bg); background: var(--green); border-color: var(--green); }
.search { flex: 1; min-width: 180px; position: relative; }
.search::before { content: ">"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font: 700 13px var(--mono); color: var(--green); }
input[type=search], select {
  font: 13px var(--mono); color: var(--text); background: var(--surface); border: 1px solid var(--line);
  border-radius: 4px; padding: 7px 10px; height: 32px; width: 100%;
}
input[type=search] { padding-left: 24px; }
input[type=search]:focus, select:focus { outline: none; border-color: var(--green-dim); box-shadow: 0 0 0 3px rgba(57, 255, 143, .12); }
select { width: auto; max-width: 200px; }

/* ---------- レイアウト ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; padding-top: 8px; padding-bottom: 80px; }
aside { position: sticky; top: 112px; align-self: start; display: grid; gap: 20px; min-width: 0; }

/* ---------- 記事 ---------- */
.day {
  font: 700 12px/1 var(--mono); color: var(--green); letter-spacing: .08em;
  margin: 26px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center;
}
.day::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--green-dim), transparent); opacity: .5; }
ol.list { list-style: none; margin: 0; padding: 0; }
.card { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.thumb {
  position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s, filter .25s; filter: saturate(.92); }
.card:hover .thumb img { transform: scale(1.03); filter: none; }
.ph {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
  font: 700 13px/1.3 var(--mono); color: var(--rc);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
    linear-gradient(135deg, var(--surface-2), #0a0f0c);
}
.ph::before { content: attr(data-sym); position: absolute; top: 8px; left: 10px; font-size: 11px; color: var(--dim); font-weight: 400; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 12px/1.5 var(--mono); color: var(--muted); }
.rg { font-weight: 800; color: var(--bg); background: var(--rc); border-radius: 3px; padding: 0 5px; font-size: 11px; }
.src { color: var(--rc); font-weight: 700; }
.new { color: var(--green); font-weight: 800; }
.new::before { content: "● "; }
.title {
  display: block; margin: 6px 0 0; color: var(--title); text-decoration: none;
  font: 700 19px/1.5 var(--sans); letter-spacing: .01em; overflow-wrap: anywhere;
}
.title:hover { color: var(--green); }
.title:visited { color: var(--visited); }
.ja { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.summary { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin: 6px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.foot { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font: 12px/1.5 var(--mono); color: var(--dim); }
.foot a { color: var(--muted); text-decoration: none; }
.foot a:hover { color: var(--green); }
.tg { color: var(--green-dim); }
.score { color: var(--ja); }
.empty { font: 14px var(--mono); color: var(--muted); padding: 60px 0; text-align: center; }
.more {
  display: block; width: 100%; margin-top: 24px; padding: 14px; cursor: pointer;
  font: 700 13px var(--mono); color: var(--green); background: var(--surface); border: 1px dashed var(--green-dim); border-radius: 4px;
}
.more:hover { background: var(--surface-2); }

/* ---------- サイドバー ---------- */
.box { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.box h3 { font: 700 12px/1 var(--mono); color: var(--green); letter-spacing: .1em; margin: 0 0 12px; }
.box h3::before { content: "## "; color: var(--dim); }
.trend { list-style: none; margin: 0; padding: 0; counter-reset: t; }
.trend li { counter-increment: t; }
.trend button {
  display: flex; width: 100%; align-items: baseline; gap: 10px; padding: 6px 0; cursor: pointer;
  background: none; border: 0; border-bottom: 1px dashed var(--line); color: var(--text); font: 700 14px var(--sans); text-align: left;
}
.trend button::before { content: counter(t, decimal-leading-zero); font: 700 12px var(--mono); color: var(--dim); width: 20px; }
.trend button:hover, .trend button[aria-pressed="true"] { color: var(--green); }
.trend .n { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.srcs { display: grid; gap: 2px; font: 12px/1.7 var(--mono); }
.srcs button { display: flex; justify-content: space-between; background: none; border: 0; color: var(--muted); font: inherit; padding: 0; cursor: pointer; text-align: left; }
.srcs button:hover, .srcs button[aria-pressed="true"] { color: var(--title); }
.srcs .sec { color: var(--rc); font-weight: 700; margin-top: 8px; }
.srcs .sec:first-child { margin-top: 0; }
.active-filter { display: none; align-items: center; gap: 8px; margin-top: 16px; font: 12px var(--mono); color: var(--muted); }
.active-filter.on { display: flex; }
.active-filter button { font: 700 12px var(--mono); color: var(--bg); background: var(--green); border: 0; border-radius: 3px; padding: 3px 8px; cursor: pointer; }

[data-r="ja"] { --rc: var(--ja); }
[data-r="en"] { --rc: var(--en); }
[data-r="zh"] { --rc: var(--zh); }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
  aside { position: static; order: -1; padding-top: 12px; }
  aside .srcbox { display: none; }
  .trend { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .trend::-webkit-scrollbar { display: none; }
  .trend button { border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; white-space: nowrap; font-size: 13px; }
  .trend button::before { display: none; }
  .box { padding: 10px 12px; }
  .box h3 { margin-bottom: 8px; }
}
@media (max-width: 640px) {
  .logo { font-size: 28px; }
  .tagline, .status .sub { display: none; }
  .status { font-size: 11px; }
  .masthead .wrap { padding-top: 16px; padding-bottom: 10px; }
  .regions button { padding: 12px 12px 10px; font-size: 13px; }
  .regions .count { display: none; }
  select { max-width: none; flex: 1; }
  .search { flex-basis: 100%; order: 3; }
  .card { grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 14px 0; }
  .title { font-size: 16px; line-height: 1.5; margin-top: 4px; }
  .summary { display: none; }
  .ph { font-size: 10px; padding: 6px; }
  .ph::before { display: none; }
  .meta { font-size: 11px; gap: 2px 8px; }
  .foot { font-size: 11px; }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div>
      <h1 class="logo">TERRAZINE<span class="cur"></span></h1>
    </div>
    <div class="tagline"><b>$</b> tail -f /world/tech --lang=ja,en,zh</div>
    <div class="status" id="status"></div>
  </div>
</header>

<nav class="bar">
  <div class="wrap">
    <div class="regions" id="regions"></div>
    <div class="filters">
      <div class="tags" id="tags"></div>
      <select id="source" aria-label="ソース"></select>
      <div class="search"><input type="search" id="q" placeholder="grep (例: DeepSeek, 芯片, 半導体)"></div>
    </div>
  </div>
</nav>

<div class="wrap layout">
  <main>
    <div class="active-filter" id="active"></div>
    <div id="list"></div>
  </main>
  <aside>
    <section class="box">
      <h3>TRENDING 24H</h3>
      <ol class="trend" id="trend"></ol>
    </section>
    <section class="box srcbox">
      <h3>SOURCES</h3>
      <div class="srcs" id="srcs"></div>
    </section>
  </aside>
</div>

<script>
const DATA = /*__DATA__*/null;

const REGIONS = [["all", "TOP", "--green"], ["ja", "日本", "--ja"], ["en", "英語圏", "--en"], ["zh", "中華圏", "--zh"]];
const REGION_CODE = { ja: "JP", en: "EN", zh: "CN" };
const REGION_NAME = { ja: "日本", en: "英語圏", zh: "中華圏" };
const TAGS = [["all", "ALL"], ["ai", "AI"], ["dev", "DEV"], ["hw", "HW"]];
const TAG_LABEL = { ai: "#AI", dev: "#DEV", hw: "#HW" };
// トレンド集計の対象。表記ゆれ (英/中/日) をまとめて数える
const ENTITIES = [
  ["OpenAI", /openai|chatgpt|gpt-?\d/i], ["Anthropic", /anthropic|claude/i], ["Google", /google|gemini|deepmind|谷歌/i],
  ["DeepSeek", /deepseek|深度求索/i], ["Qwen / 阿里", /qwen|通义|千问|alibaba|阿里/i], ["Kimi", /kimi|moonshot|月之暗面/i],
  ["ByteDance", /bytedance|字节|豆包|doubao/i], ["Tencent", /tencent|腾讯|混元/i], ["xAI / Grok", /\bxai\b|grok/i],
  ["Meta", /\bmeta\b|llama/i], ["Microsoft", /microsoft|微软|マイクロソフト|copilot/i], ["Apple", /apple|苹果|iphone|アップル/i],
  ["NVIDIA", /nvidia|英伟达|エヌビディア/i], ["Huawei", /huawei|华为|ファーウェイ|昇腾|麒麟/i], ["TSMC", /tsmc|台积电|台湾積体/i],
  ["AMD", /\bamd\b/i], ["Intel", /intel|英特尔|インテル/i], ["Xiaomi", /xiaomi|小米|シャオミ/i], ["Tesla", /tesla|特斯拉|テスラ/i],
  ["半導体", /semiconductor|chip|芯片|半导体|半導体/i], ["Agent", /agent|智能体|エージェント/i], ["Robot", /robot|humanoid|机器人|ロボット/i],
  ["Rust", /\brust\b/i], ["Linux", /linux/i], ["GitHub", /github/i], ["Security", /cve-|zero-day|0-day|漏洞|脆弱性|サイバー攻撃/i],
];
const PAGE = 60;

const store = {
  get(k, d) { try { const v = localStorage.getItem("tz:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tz:" + k, JSON.stringify(v)); } catch {} },
};
const state = { region: store.get("region", "all"), tag: store.get("tag", "all"), source: "", q: "", trend: null, shown: PAGE };
const lastVisit = store.get("lastVisit", null);
store.set("lastVisit", new Date().toISOString());

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const translateUrl = (u) => `https:/\/translate.google.com/translate?sl=auto&tl=ja&hl=ja&u=${encodeURIComponent(u)}`;
const text = (it) => `${it.title} ${it.title_ja || ""} ${it.summary}`;

function rel(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m}分前`;
  if (m < 1440) return `${Math.floor(m / 60)}時間前`;
  return `${Math.floor(m / 1440)}日前`;
}
function clock(iso) { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dayLabel(iso) {
  const d = new Date(iso), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  const ymd = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  const wd = "日月火水木金土"[d.getDay()];
  if (d.toDateString() === t.toDateString()) return `${ymd} (${wd}) /\/ TODAY`;
  if (d.toDateString() === y.toDateString()) return `${ymd} (${wd}) /\/ YESTERDAY`;
  return `${ymd} (${wd})`;
}

function filtered({ ignoreRegion = false } = {}) {
  const q = state.q.trim().toLowerCase();
  return DATA.items.filter((it) =>
    (ignoreRegion || state.region === "all" || it.region === state.region) &&
    (state.tag === "all" || it.tags.includes(state.tag)) &&
    (!state.source || it.source === state.source) &&
    (!state.trend || state.trend[1].test(text(it))) &&
    (!q || (text(it) + " " + it.source).toLowerCase().includes(q))
  );
}

function thumb(it) {
  const ph = `<span class="ph" data-sym="[${REGION_CODE[it.region]}]">${esc(it.via || it.source)}</span>`;
  const img = it.image
    ? `<img src="${esc(it.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`
    : "";
  return `<a class="thumb" href="${esc(it.link)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${ph}${img}</a>`;
}

function card(it) {
  const isNew = lastVisit && it.first_seen > lastVisit;
  const extra = [
    it.score ? `<span class="score">▲${it.score}</span>` : "",
    it.replies ? `<span class="score">${it.replies}レス</span>` : "",
    ...it.tags.map((t) => `<span class="tg">${TAG_LABEL[t] || t}</span>`),
    it.region !== "ja" ? `<a href="${translateUrl(it.link)}" target="_blank" rel="noopener">[日本語で読む]</a>` : "",
    it.comments ? `<a href="${esc(it.comments)}" target="_blank" rel="noopener">[comments]</a>` : "",
  ].join("");
  return `<li class="card" data-r="${it.region}">
    ${thumb(it)}
    <div>
      <div class="meta">
        <span class="rg">${REGION_CODE[it.region]}</span>
        <span class="src">${esc(it.source)}${it.via ? ` · ${esc(it.via)}` : ""}</span>
        <time datetime="${it.published}" title="${esc(new Date(it.published).toLocaleString("ja-JP"))}">${clock(it.published)} · ${rel(it.published)}</time>
        ${isNew ? '<span class="new">NEW</span>' : ""}
      </div>
      <a class="title" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title_ja || it.title)}${it.title_ja ? `<span class="ja">${esc(it.title)}</span>` : ""}</a>
      ${it.summary ? `<p class="summary">${esc(it.summary_ja || it.summary)}</p>` : ""}
      <div class="foot">${extra}</div>
    </div>
  </li>`;
}

function renderList() {
  const items = filtered();
  const list = $("list");
  if (!items.length) { list.innerHTML = '<p class="empty">// no match. 条件を変えてみてください</p>'; return; }
  let out = "", cur = null;
  for (const it of items.slice(0, state.shown)) {
    const label = dayLabel(it.published);
    if (label !== cur) { if (cur) out += "</ol>"; out += `<h2 class="day">${label}</h2><ol class="list">`; cur = label; }
    out += card(it);
  }
  out += "</ol>";
  if (items.length > state.shown) out += `<button class="more" id="more">$ load --more  (残り ${items.length - state.shown} 件)</button>`;
  list.innerHTML = out;
  const more = $("more");
  if (more) more.onclick = () => { state.shown += PAGE; renderList(); };
}

function renderRegions() {
  const base = filtered({ ignoreRegion: true });
  $("regions").innerHTML = REGIONS.map(([v, label, color]) => {
    const n = v === "all" ? base.length : base.filter((it) => it.region === v).length;
    return `<button data-v="${v}" style="--c: var(${color})" aria-pressed="${state.region === v}">${label}<span class="count">${n}</span></button>`;
  }).join("");
}

function renderTrend() {
  const since = Date.now() - 24 * 3600e3;
  const recent = DATA.items.filter((it) => new Date(it.published) >= since);
  const ranked = ENTITIES.map((e) => [e, recent.filter((it) => e[1].test(text(it))).length])
    .filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 10);
  $("trend").innerHTML = ranked.map(([e, n]) =>
    `<li><button data-k="${esc(e[0])}" aria-pressed="${state.trend?.[0] === e[0]}">${esc(e[0])}<span class="n">${n}</span></button></li>`).join("");
}

function renderSources() {
  const counts = {};
  DATA.items.forEach((it) => { counts[it.source] = (counts[it.source] || 0) + 1; });
  let html = "";
  for (const r of ["ja", "en", "zh"]) {
    html += `<div class="sec" data-r="${r}">[${REGION_CODE[r]}] ${REGION_NAME[r]}</div>`;
    html += DATA.sources.filter((s) => s.region === r).map((s) =>
      `<button data-s="${esc(s.name)}" aria-pressed="${state.source === s.name}"><span>${esc(s.name)}</span><span>${counts[s.name] || 0}</span></button>`).join("");
  }
  $("srcs").innerHTML = html;
  $("source").innerHTML = '<option value="">all sources</option>' + ["ja", "en", "zh"].map((r) =>
    `<optgroup label="${REGION_NAME[r]}">` + DATA.sources.filter((s) => s.region === r).map((s) =>
      `<option value="${esc(s.name)}"${state.source === s.name ? " selected" : ""}>${esc(s.name)} (${counts[s.name] || 0})</option>`).join("") + "</optgroup>").join("");
}

function renderActive() {
  const el = $("active");
  const label = state.trend ? `trend: ${state.trend[0]}` : state.source ? `source: ${state.source}` : "";
  el.className = "active-filter" + (label ? " on" : "");
  el.innerHTML = label ? `<span>/\/ filter</span><button id="clear">${esc(label)} ×</button>` : "";
  if (label) $("clear").onclick = () => { state.trend = null; state.source = ""; update(); };
}

function update({ keepPage = false } = {}) {
  if (!keepPage) state.shown = PAGE;
  renderRegions(); renderTrend(); renderSources(); renderActive(); renderList();
}

function init() {
  if (!DATA) { $("list").innerHTML = '<p class="empty">// no data. build.py を実行してください</p>'; return; }
  const n24 = DATA.items.filter((it) => new Date(it.published) >= Date.now() - 24 * 3600e3).length;
  $("status").innerHTML = `<span class="ok">●</span> synced ${rel(DATA.generated)}<span class="sub"><br>${DATA.sources.length} sources · ${n24} items / 24h</span>`;
  $("tags").innerHTML = TAGS.map(([v, l]) => `<button data-v="${v}" aria-pressed="${state.tag === v}">${l}</button>`).join("");

  $("regions").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.region = b.dataset.v; store.set("region", state.region); update();
  };
  $("tags").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.tag = b.dataset.v; store.set("tag", state.tag);
    $("tags").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    update();
  };
  $("trend").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.trend = state.trend?.[0] === b.dataset.k ? null : ENTITIES.find((x) => x[0] === b.dataset.k);
    update(); window.scrollTo({ top: 0 });
  };
  $("srcs").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.source = state.source === b.dataset.s ? "" : b.dataset.s; update(); window.scrollTo({ top: 0 });
  };
  $("source").onchange = (e) => { state.source = e.target.value; update(); };
  let t;
  $("q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 150); };
  update();
}
init();
</script>
</body>
</html>
