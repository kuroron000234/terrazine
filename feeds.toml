# TERRAZINE が収集するフィード一覧
# 方針: 大手メディアより、コミュニティ・個人・一次情報など「早くて実用寄り」のソースを優先
#
# region:  "ja"(日本) / "en"(英語圏) / "zh"(中華圏)
# tags:    このフィードの記事に常に付けるタグ (ai / dev / hw)
# filter:  true にすると、キーワードに一致した記事だけ残す (雑多なソース向け)
# exclude: タイトルがこの正規表現に一致する記事は捨てる
# limit:   1回の取得で使う最大件数
# og:      false にすると記事ページの og:image を取りに行かない (ロゴしか出ないサイト向け)
# type:    "5ch" のときは url に板のURLを書く。min_res = 最低レス数

# ================= 日本 =================
[[feed]]
name = "GIGAZINE"
url = "https://gigazine.net/news/rss_2.0/"
region = "ja"

[[feed]]
name = "はてブ IT"
url = "https://b.hatena.ne.jp/hotentry/it.rss"
region = "ja"

[[feed]]
name = "Zenn"
url = "https://zenn.dev/feed"
region = "ja"
tags = ["dev"]

[[feed]]
name = "Qiita"
url = "https://qiita.com/popular-items/feed"
region = "ja"
tags = ["dev"]

[[feed]]
name = "Publickey"
url = "https://www.publickey1.jp/atom.xml"
region = "ja"
tags = ["dev"]

[[feed]]
name = "ITmedia AI+"
url = "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml"
region = "ja"
tags = ["ai"]

[[feed]]
name = "PC Watch"
url = "https://pc.watch.impress.co.jp/data/rss/1.0/pcw/feed.rdf"
region = "ja"
tags = ["hw"]
exclude = "お買い得|セール|特価|最安"

[[feed]]
name = "5ch ニュー速+"
type = "5ch"
url = "https://asahi.5ch.io/newsplus/"
region = "ja"
filter = true
og = false

[[feed]]
name = "5ch ビジネス+"
type = "5ch"
url = "https://egg.5ch.io/bizplus/"
region = "ja"
filter = true
min_res = 30
og = false

[[feed]]
name = "5ch 科学+"
type = "5ch"
url = "https://egg.5ch.io/scienceplus/"
region = "ja"
filter = true
min_res = 20
og = false

